---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-secrets
    creationPolicy: Owner
  data:
    - secretKey: GF_DOMAIN
      remoteRef:
        key: "37d80bcf-8508-4f59-a044-b3ce013c88a7"
    - secretKey: GF_SECURITY_ADMIN_USER
      remoteRef:
        key: "c92b7062-fb75-43cb-a6fe-b3ce013c5aa8"
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: "3b3c023d-fa12-42d4-a480-b3c500f3d86a"